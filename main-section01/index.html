<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zuviland | Global Farming Talent Career Pass Platform</title>
  <meta name="description" content="Zuviland sees international farm workers not as seasonal labour, but as the talent who will shape the future of farming. Public institutions select; we design the career path that follows.">
  <link rel="preload" as="image" href="./assets/main-section01-bg.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="./main-section01.css?v=20261126-1">
</head>
<body>

<section class="hero" id="hero" aria-labelledby="hero-title">
  <div class="hero__bg" aria-hidden="true">
    <img src="./assets/main-section01-bg.jpg" alt="" width="1600" height="742" fetchpriority="high">
  </div>

  <div class="hero__box">
    <div class="hero__content">
      <h1 class="hero__title" id="hero-title">
        <span class="line"><span class="line__inner">Global Farming Talent</span></span>
        <span class="line"><span class="line__inner">Career Pass Platform</span></span>
      </h1>
      <p class="hero__desc">
        Zuviland sees international farm workers not as seasonal labour, but<br class="mo-only"><span class="pc-only"> </span>as the talent who will shape<br class="pc-only"><span class="mo-only"> </span>the future of farming. Public institutions<br class="mo-only"><span class="pc-only"> </span>select; we design the career path that follows.
      </p>
    </div>
    <div class="hero__cta">
      <a href="https://zuviland-en.liveklass.com/forms/RSUzZaSeN9XWVYJSatbT" class="btn btn--primary" target="_blank" rel="noopener">Government Inquiries</a>
      <a href="https://zuviland-en.liveklass.com/forms/mb87rtMVzQvM6uarZXrT" class="btn btn--secondary" target="_blank" rel="noopener">Investment Partnership</a>
    </div>
  </div>

  <!-- main-section01(pc) : 인물(모션) + 주변 일러스트(고정) / 태블릿도 이 배치 사용 -->
  <div class="hero__stage" aria-hidden="true">
    <div class="hero__people people-motion">
      <img src="./assets/main-section01-people.webp" alt="" width="694" height="288">
    </div>
    <!-- 왼쪽 트랙터 언덕 : 넓은 화면에서도 언덕 끝이 둥글게 마무리되도록 별도 그림 -->
    <div class="hero__farm">
      <img src="./assets/main-section01(pc)-farm.webp" alt="" width="662" height="252">
    </div>
    <div class="hero__scene">
      <img src="./assets/main-section01(pc)-scene.webp" alt="" width="1520" height="360">
    </div>
  </div>

  <!-- main-section01(mob) : 인물만 -->
  <div class="hero__stage-mo people-motion" aria-hidden="true">
    <img src="./assets/main-section01-people.webp" alt="" width="694" height="288">
  </div>
</section>

<script src="./main-section01.js" defer></script>
</body>
</html>
